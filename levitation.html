<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PCD Magnetic Levitation Stand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
const THREE           = await import(/* @vite-ignore */ 'https://esm.sh/three@0.160.0');
const { OrbitControls }   = await import(/* @vite-ignore */ 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js');
const { EffectComposer }  = await import(/* @vite-ignore */ 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js');
const { RenderPass }      = await import(/* @vite-ignore */ 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js');
const { UnrealBloomPass } = await import(/* @vite-ignore */ 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js');

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Scene & Camera ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 3.2, 7.5);
camera.lookAt(0, 1.8, 0);

// ── Gradient background ───────────────────────────────────────────────────────
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 4; bgCanvas.height = 512;
const bctx = bgCanvas.getContext('2d');
const bgGrad = bctx.createLinearGradient(0, 0, 0, 512);
bgGrad.addColorStop(0,    '#0b0b18');
bgGrad.addColorStop(0.45, '#16163a');
bgGrad.addColorStop(1,    '#080810');
bctx.fillStyle = bgGrad;
bctx.fillRect(0, 0, 4, 512);
scene.background = new THREE.CanvasTexture(bgCanvas);

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x303050, 0.6));

const key = new THREE.DirectionalLight(0xfff5e0, 3.5);
key.position.set(4, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8090ff, 0.7);
fill.position.set(-6, 4, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd700, 1.0);
rim.position.set(0, 7, -6);
scene.add(rim);

const magGlow = new THREE.PointLight(0xffa020, 3.5, 4);
magGlow.position.set(0, 0.35, 0);
scene.add(magGlow);

const bottleGlow = new THREE.PointLight(0xffd060, 1.8, 2.5);
bottleGlow.position.set(0, 2.0, 0);
scene.add(bottleGlow);

// ── Desk ──────────────────────────────────────────────────────────────────────
const deskTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a0e08'; ctx.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 60; i++) {
    const y = Math.random() * 1024;
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${55 + Math.random()*30},${22 + Math.random()*15},${8 + Math.random()*8},0.25)`;
    ctx.lineWidth = 0.8 + Math.random() * 1.5;
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(300, y + (Math.random()-0.5)*40, 700, y + (Math.random()-0.5)*40, 1024, y + (Math.random()-0.5)*25);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
})();

const desk = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ map: deskTex, roughness: 0.45, metalness: 0.05 })
);
desk.rotation.x = -Math.PI / 2;
desk.receiveShadow = true;
scene.add(desk);

// ── Base – outer brushed-aluminium ring ───────────────────────────────────────
const alMat = new THREE.MeshStandardMaterial({ color: 0x9090a8, roughness: 0.25, metalness: 0.92 });
const baseOuter = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.13, 80), alMat);
baseOuter.position.y = 0.065;
baseOuter.castShadow = true; baseOuter.receiveShadow = true;
scene.add(baseOuter);

// engraved inner ledge
const ledge = new THREE.Mesh(
  new THREE.CylinderGeometry(1.28, 1.28, 0.01, 80, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x606070, roughness: 0.1, metalness: 1.0, side: THREE.BackSide })
);
ledge.position.y = 0.065;
scene.add(ledge);

// ── Base – inner dark-wood disc with PCD engraving ────────────────────────────
const woodTex = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  // base tone
  const g = ctx.createRadialGradient(256, 256, 10, 256, 256, 260);
  g.addColorStop(0, '#2e1c0c'); g.addColorStop(0.6, '#271608'); g.addColorStop(1, '#1a0e06');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  // grain
  for (let i = 0; i < 50; i++) {
    const y = Math.random() * 512;
    ctx.beginPath();
    ctx.strokeStyle = `rgba(${70+Math.random()*30},${28+Math.random()*18},${8+Math.random()*10},0.3)`;
    ctx.lineWidth = 0.6 + Math.random() * 1.2;
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(150, y+(Math.random()-0.5)*25, 360, y+(Math.random()-0.5)*25, 512, y+(Math.random()-0.5)*20);
    ctx.stroke();
  }
  // PCD engraving
  ctx.save();
  ctx.font = 'bold 96px "Georgia", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // shadow / depth
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText('PCD', 259, 259);
  // gold shimmer
  const tg = ctx.createLinearGradient(130, 210, 380, 310);
  tg.addColorStop(0,   '#a07830');
  tg.addColorStop(0.4, '#e8c060');
  tg.addColorStop(0.7, '#c89040');
  tg.addColorStop(1,   '#806020');
  ctx.fillStyle = tg; ctx.fillText('PCD', 256, 256);
  ctx.restore();
  return new THREE.CanvasTexture(c);
})();

const woodDisc = new THREE.Mesh(
  new THREE.CylinderGeometry(1.0, 1.0, 0.10, 80),
  new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.5, metalness: 0.04 })
);
woodDisc.position.y = 0.065;
woodDisc.castShadow = true; woodDisc.receiveShadow = true;
scene.add(woodDisc);

// ── Glass Bottle (LatheGeometry) ──────────────────────────────────────────────
const pts = [
  [0.00, 0.00],[0.22, 0.00],[0.26, 0.04],
  [0.30, 0.15],[0.34, 0.45],[0.37, 0.85],[0.38, 1.15],[0.36, 1.45],
  [0.31, 1.65],[0.22, 1.82],
  [0.13, 1.90],[0.11, 2.00],[0.10, 2.15],[0.10, 2.25],
  [0.135,2.30],[0.135,2.35],[0.00, 2.35],
].map(([x,y]) => new THREE.Vector2(x, y));

const bottleGeo = new THREE.LatheGeometry(pts, 56);
bottleGeo.computeVertexNormals();

const glassMat = new THREE.MeshPhysicalMaterial({
  color:              0xddeeff,
  metalness:          0.0,
  roughness:          0.04,
  transmission:       0.96,
  thickness:          0.45,
  transparent:        true,
  opacity:            0.28,
  ior:                1.52,
  clearcoat:          1.0,
  clearcoatRoughness: 0.04,
  envMapIntensity:    2.5,
  side:               THREE.DoubleSide,
});

const bottle = new THREE.Mesh(bottleGeo, glassMat);
bottle.position.set(0, 1.3, 0);
bottle.castShadow = true;
scene.add(bottle);

// ── Magnetic field lines ──────────────────────────────────────────────────────
const fieldGroup = new THREE.Group();
const LINE_COUNT = 18;
for (let i = 0; i < LINE_COUNT; i++) {
  const baseAngle  = (i / LINE_COUNT) * Math.PI * 2;
  const startR     = 0.55 + Math.random() * 0.3;
  const swirl      = (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.4);
  const topHeight  = 1.8 + Math.random() * 0.4;
  const SEGS = 32;
  const pts3 = [];
  for (let j = 0; j < SEGS; j++) {
    const t     = j / (SEGS - 1);
    const ease  = t * t * (3 - 2 * t); // smooth-step
    const angle = baseAngle + swirl * ease;
    const r     = startR * (1 - ease * 0.92);
    const y     = ease * topHeight;
    pts3.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
  }
  const curve   = new THREE.CatmullRomCurve3(pts3);
  const tubeGeo = new THREE.TubeGeometry(curve, 36, 0.003 + Math.random() * 0.003, 6, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(1.4, 0.85, 0.2),
    transparent: true,
    opacity: 0.3 + Math.random() * 0.45,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  fieldGroup.add(new THREE.Mesh(tubeGeo, tubeMat));
}
scene.add(fieldGroup);

// ── Rising particles ──────────────────────────────────────────────────────────
const PART = 800;
const pPos  = new Float32Array(PART * 3);
const pSpd  = new Float32Array(PART);
const pLife = new Float32Array(PART);

function resetParticle(i) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * 0.72;
  pPos[i*3]   = Math.cos(a) * r;
  pPos[i*3+1] = Math.random() * 2.2;
  pPos[i*3+2] = Math.sin(a) * r;
  pSpd[i]  = 0.003 + Math.random() * 0.006;
  pLife[i] = Math.random();
}
for (let i = 0; i < PART; i++) resetParticle(i);

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

const pMat = new THREE.PointsMaterial({
  color: 0xffc030,
  size: 0.025,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const particleSys = new THREE.Points(pGeo, pMat);
scene.add(particleSys);

// Soft halo disc at base centre
const haloGeo = new THREE.CircleGeometry(0.9, 64);
const haloMat = new THREE.MeshBasicMaterial({
  color: 0xff9010,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.14;
scene.add(halo);

// ── Post-processing ───────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.95, 0.55, 0.78
);
composer.addPass(bloom);

// ── OrbitControls ─────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2.1;

// ── Animation loop ────────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.012;

  // floating bob + slow spin
  bottle.position.y = 1.3 + Math.sin(t * 0.75) * 0.06;
  bottle.rotation.y = t * 0.25;

  // field lines slow rotation
  fieldGroup.rotation.y = t * 0.18;

  // particle rise
  for (let i = 0; i < PART; i++) {
    pPos[i*3+1] += pSpd[i];
    if (pPos[i*3+1] > 2.4) resetParticle(i);
  }
  pGeo.attributes.position.needsUpdate = true;

  // pulsing glow
  magGlow.intensity  = 3.0 + Math.sin(t * 2.2) * 0.8;
  bottleGlow.position.y = bottle.position.y + 0.5;

  controls.update();
  composer.render();
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
